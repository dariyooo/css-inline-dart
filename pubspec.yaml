name: css_inline_dart
description: "Inline CSS into HTML style attributes, for email and other clients that ignore stylesheets. Native bindings to the Rust css-inline crate."
version: 0.0.1+0.19.1
repository: https://github.com/dariyooo/css-inline-dart
issue_tracker: https://github.com/dariyooo/css-inline-dart/issues
topics:
  - html
  - css
  - email
  - ffi

environment:
  sdk: ">=3.11.1 <4.0.0"

dependencies:
  ffi: ^2.2.0
  hooks: ^2.0.2
  native_toolchain_rust: ^1.0.3

dev_dependencies:
  test: ^1.21.4
  build_runner: ^2.4.4
  ffigen: ^20.1.1