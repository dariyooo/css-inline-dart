[package]
name = "css_inline_dart"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["staticlib", "cdylib"]

[features]
# Off by default: a rendering call that reaches the network without being asked
# to is a surprise, and it drags reqwest into every binary. The build hook turns
# this on when a consumer opts in through their pubspec.
default = []
http = ["css-inline/http"]

[dependencies]
css-inline = { version = "0.19.1", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
